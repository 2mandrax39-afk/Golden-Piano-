
<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Golden Piano</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#111;color:#eee;font-family:Arial}
header{text-align:center;padding:14px;color:#d6b35b}
header h1{margin:0;letter-spacing:3px;font-size:26px}
header p{color:#888;font-size:12px}
main{max-width:900px;margin:auto;padding:10px}
input,select{background:#202020;color:#eee;border:1px solid #555;border-radius:8px;padding:12px;font-size:15px}
#songTitle{width:100%;margin-bottom:10px}
.sheet{background:#fffdf5;border-radius:10px;overflow:hidden}
#staff{display:block;width:100%;height:300px}
.settings{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:10px 0}
.controls{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0}
button{padding:13px 5px;border-radius:8px;border:0;font-size:14px;font-weight:bold;background:#292929;color:white}
.gold{background:#c5a04b;color:#15120b}
.status{text-align:center;color:#d8b85f;min-height:24px;padding:5px}
.octaveControls{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}
.octaveControls button{background:#c5a04b;color:#15120b;font-size:16px}
.keyboardScroll{overflow-x:auto;padding:5px 0 12px;touch-action:pan-x}
.keyboard{display:flex;position:relative;height:205px;min-width:840px;touch-action:pan-x}
.white{flex:1;background:linear-gradient(#fff,#e4e0d5);border:1px solid #777;border-radius:0 0 5px 5px;position:relative;color:#222;display:flex;justify-content:center;align-items:flex-end;padding-bottom:9px;z-index:1;touch-action:none;user-select:none}
.white.active{background:#d2ae5a}
.black{position:absolute;width:4.2%;height:125px;top:0;background:linear-gradient(#333,#080808);border:1px solid #000;border-radius:0 0 5px 5px;color:#fff;z-index:3;display:flex;align-items:flex-end;justify-content:center;padding-bottom:6px;touch-action:none;user-select:none}
.black.active{background:#bb953e}
.library{background:#1c1c1c;border:1px solid #333;border-radius:10px;padding:12px;margin-top:15px}
.library h3{color:#d6b35b;margin-top:0}
.item{border-bottom:1px solid #333;padding:10px 0;display:flex;align-items:center;gap:6px}
.item span{flex:1;overflow-wrap:anywhere}
.item button{padding:8px}
@media(max-width:500px){
#staff{height:270px}
.settings select{font-size:13px;padding:9px 4px}
}
/* LANDSCAPE MODE */
@media screen and (orientation:landscape) and (max-height:600px){
body{overflow-x:hidden}
header{padding:5px 8px}
header h1{font-size:19px;letter-spacing:1px}
header p{display:none}
main{max-width:none;padding:5px 8px}
.sheet{display:none}
#songTitle{width:48%;margin:0 0 5px;padding:8px}
.settings{display:flex;gap:5px;margin:5px 0}
.settings select{flex:1;min-width:0;padding:7px 4px;font-size:12px}
.controls{display:flex;gap:5px;margin:5px 0}
.controls button{flex:1;padding:8px 2px;font-size:12px}
.status{min-height:18px;padding:2px;font-size:12px}
.octaveControls{margin:5px 0;gap:5px}
.octaveControls button{padding:8px;font-size:13px}
.keyboardScroll{overflow-x:hidden;padding:2px 0 5px}
.keyboard{min-width:100%;height:55vh;height:calc(100vh - 190px);max-height:330px}
.white{padding-bottom:5px;font-size:11px}
.black{width:3.1%;height:58%;padding-bottom:3px;font-size:9px}
.library{display:none}
}
</style>
</head>
<body>

<header>
<h1>🎹 GOLDEN PIANO</h1>
<p>YOUR PERSONAL MUSIC STUDIO</p>
</header>

<main>

<input id="songTitle" placeholder="Navn på musikstykke">

<div class="sheet">
<canvas id="staff"></canvas>
</div>

<div class="settings">

<select id="duration">
<option value="4">Helnode</option>
<option value="2">Halvnode</option>
<option value="1" selected>Fjerdedelsnode</option>
<option value="0.5">Ottendedelsnode</option>
<option value="0.25">Sekstendedelsnode</option>
</select>

<select id="tempo">
<option value="60">60 BPM</option>
<option value="70">70 BPM</option>
<option value="80">80 BPM</option>
<option value="90">90 BPM</option>
<option value="100" selected>100 BPM</option>
<option value="110">110 BPM</option>
<option value="120">120 BPM</option>
<option value="140">140 BPM</option>
<option value="160">160 BPM</option>
<option value="180">180 BPM</option>
</select>

<select id="signature">
<option value="4">4/4 takt</option>
<option value="3">3/4 takt</option>
<option value="2">2/4 takt</option>
<option value="6">6/8 takt</option>
</select>

</div>

<div class="controls">
<button class="gold" onclick="record()">● OPTAG</button>
<button class="gold" onclick="play()">▶ AFSPIL</button>
<button onclick="stop()">■ STOP</button>
</div>

<div class="controls">
<button onclick="undo()">↶ FORTRYD</button>
<button class="gold" onclick="save()">💾 GEM</button>
<button class="gold" onclick="newSong()">＋ NY SANG</button>
</div>

<div class="controls">
<button onclick="exportMusic()">📤 EKSPORT</button>
<button onclick="importMusic()">📥 IMPORT</button>
<button onclick="clearNotes()">🗑 SLET NODER</button>
</div>

<div class="status" id="status">Klar til at spille</div>

<div class="octaveControls">
<button onclick="shiftOctave(-1)">◀ NED EN OKTAV</button>
<button onclick="shiftOctave(1)">OP EN OKTAV ▶</button>
</div>

<div class="keyboardScroll">
<div class="keyboard" id="keyboard"></div>
</div>

<div class="library">
<h3>🎼 Mine kompositioner</h3>
<div id="library"></div>
</div>

<input type="file" id="importFile" accept=".json" style="display:none">

</main>

<script>
"use strict";

const keyboard=document.getElementById("keyboard");
const canvas=document.getElementById("staff");
const ctx=canvas.getContext("2d");
const statusBox=document.getElementById("status");

let notes=[];
let recording=false;
let playing=false;
let timers=[];
let songs=[];
let piano=null;
let reverb=null;
let pianoReady=false;
let loadingPromise=null;

let keyboardStart=48;

const MIN_START=24;
const MAX_START=72;
const activeKeys=new Map();

/* LOAD CONCERT GRAND PIANO */

async function loadPiano(){

 if(pianoReady)return true;
 if(loadingPromise)return loadingPromise;

 loadingPromise=(async()=>{

  try{

   statusBox.textContent="Indlæser koncertflygel...";

   if(!window.Tone){
    throw new Error("Tone.js kunne ikke indlæses");
   }

   await Tone.start();

   reverb=new Tone.Reverb({
    decay:2.8,
    wet:0.14
   });

   await reverb.ready;
   reverb.toDestination();

   piano=new Tone.Sampler({

    urls:{
     A0:"A0.mp3",
     C1:"C1.mp3",
     "D#1":"Ds1.mp3",
     "F#1":"Fs1.mp3",

     A1:"A1.mp3",
     C2:"C2.mp3",
     "D#2":"Ds2.mp3",
     "F#2":"Fs2.mp3",

     A2:"A2.mp3",
     C3:"C3.mp3",
     "D#3":"Ds3.mp3",
     "F#3":"Fs3.mp3",

     A3:"A3.mp3",
     C4:"C4.mp3",
     "D#4":"Ds4.mp3",
     "F#4":"Fs4.mp3",

     A4:"A4.mp3",
     C5:"C5.mp3",
     "D#5":"Ds5.mp3",
     "F#5":"Fs5.mp3",

     A5:"A5.mp3",
     C6:"C6.mp3",
     "D#6":"Ds6.mp3",
     "F#6":"Fs6.mp3",

     A6:"A6.mp3",
     C7:"C7.mp3",
     "D#7":"Ds7.mp3",
     "F#7":"Fs7.mp3",

     A7:"A7.mp3",
     C8:"C8.mp3"
    },

    baseUrl:"https://tonejs.github.io/audio/salamander/",
    release:2.2

   }).connect(reverb);

   await Tone.loaded();

   pianoReady=true;
   statusBox.textContent="Koncertflygel klar 🎹";
   return true;

  }catch(err){

   pianoReady=false;
   piano=null;
   loadingPromise=null;

   statusBox.textContent="Flygel kunne ikke indlæses. Tryk på en tangent for at prøve igen.";

   console.error(err);
   return false;

  }

 })();

 return loadingPromise;
}

/* MIDI NOTE NAME */

function midiName(m){
 return Tone.Frequency(m,"midi").toNote();
}

/* MOVE KEYBOARD OCTAVE */

function shiftOctave(direction){

 const newStart=keyboardStart+(direction*12);

 if(newStart<MIN_START){
  statusBox.textContent="Du er ved de laveste toner";
  return;
 }

 if(newStart>MAX_START){
  statusBox.textContent="Du er ved de højeste toner";
  return;
 }

 releaseAll();

 keyboardStart=newStart;
 buildKeys();

 statusBox.textContent="Klaviatur flyttet til C"+(Math.floor(keyboardStart/12)-1);
}

/* BUILD KEYS */

function buildKeys(){

 keyboard.innerHTML="";
 const whites=[];
 const end=keyboardStart+35;

 for(let m=keyboardStart;m<=end;m++){

  if(![1,3,6,8,10].includes(m%12)){

   const k=document.createElement("div");
   k.className="white";
   k.dataset.midi=m;

   if(m%12===0){
    k.textContent="C"+(Math.floor(m/12)-1);
   }

   k.addEventListener("pointerdown",e=>{
    e.preventDefault();
    e.stopPropagation();
    startKey(m,k);
   });

   k.addEventListener("pointerup",e=>{
    e.preventDefault();
    releaseKey(m);
   });

   k.addEventListener("pointercancel",()=>{
    releaseKey(m);
   });

   keyboard.appendChild(k);
   whites.push(k);
  }
 }

 for(let m=keyboardStart;m<=end;m++){

  if(![1,3,6,8,10].includes(m%12))continue;

  const k=document.createElement("div");
  k.className="black";
  k.dataset.midi=m;

  const ix=whites.findIndex(
   w=>Number(w.dataset.midi)===m-1
  );

  if(ix<0)continue;

  k.style.left=((ix+1)*100/whites.length)+"%";

  k.addEventListener("pointerdown",e=>{
   e.preventDefault();
   e.stopPropagation();
   startKey(m,k);
  });

  k.addEventListener("pointerup",e=>{
   e.preventDefault();
   releaseKey(m);
  });

  k.addEventListener("pointercancel",()=>{
   releaseKey(m);
  });

  keyboard.appendChild(k);
 }
}

/* PRESS KEY */

async function startKey(m,k){

 if(activeKeys.has(m))return;

 k.classList.add("active");
 activeKeys.set(m,k);

 const ok=await loadPiano();

 if(!ok||!activeKeys.has(m))return;

 try{
  piano.triggerAttack(midiName(m));
 }catch(e){
  console.error(e);
 }

 notes.push({
  midi:m,
  duration:Number(document.getElementById("duration").value)
 });

 draw();
}

/* RELEASE KEY */

function releaseKey(m){

 const k=activeKeys.get(m);
 if(!k)return;

 activeKeys.delete(m);
 k.classList.remove("active");

 if(piano&&pianoReady){

  try{
   piano.triggerRelease(midiName(m));
  }catch(e){
   console.error(e);
  }
 }
}

function releaseAll(){
 Array.from(activeKeys.keys()).forEach(releaseKey);
}

window.addEventListener("blur",releaseAll);

/* RECORD */

function record(){

 recording=!recording;

 statusBox.textContent=recording
  ?"● Optagelse aktiv"
  :"Optagelse stoppet";
}

/* STOP */

function stop(){

 recording=false;
 playing=false;

 timers.forEach(clearTimeout);
 timers=[];

 releaseAll();

 if(piano&&pianoReady){
  try{
   piano.releaseAll();
  }catch(e){}
 }

 statusBox.textContent="Stoppet";
}

/* PLAY */

async function play(){

 if(!notes.length){
  statusBox.textContent="Spil nogle toner først";
  return;
 }

 if(!await loadPiano())return;

 stop();
 playing=true;
 statusBox.textContent="▶ Afspiller";

 const beat=60000/
  Number(document.getElementById("tempo").value);

 let elapsed=0;

 notes.forEach(n=>{

  const start=elapsed;

  timers.push(setTimeout(()=>{

   if(!playing)return;

   try{

    piano.triggerAttack(midiName(n.midi));
    flash(n.midi);

    timers.push(setTimeout(()=>{

     if(playing){
      piano.triggerRelease(midiName(n.midi));
     }

    },n.duration*beat));

   }catch(e){
    console.error(e);
   }

  },start));

  elapsed+=n.duration*beat;
 });

 timers.push(setTimeout(()=>{

  playing=false;
  statusBox.textContent="Afspilning færdig";

 },elapsed+250));
}

/* FLASH KEY */

function flash(m){

 const k=keyboard.querySelector(
  '[data-midi="'+m+'"]'
 );

 if(k){
  k.classList.add("active");

  setTimeout(()=>{
   k.classList.remove("active");
  },180);
 }
}

/* UNDO */

function undo(){
 notes.pop();
 draw();
 statusBox.textContent="Sidste node fjernet";
}

/* NEW SONG */

function newSong(){

 stop();
 notes=[];

 document.getElementById("songTitle").value="";

 draw();

 statusBox.textContent="Ny komposition";
}

/* CLEAR NOTES */

function clearNotes(){

 if(confirm("Slet alle noder i dette musikstykke?")){

  notes=[];
  draw();

  statusBox.textContent="Noder slettet";
 }
}

/* SAVE */

function save(){

 if(!notes.length){
  statusBox.textContent="Der er ingen noder at gemme";
  return;
 }

 const song={

  id:Date.now(),

  title:
   document.getElementById("songTitle").value||
   "Min komposition",

  tempo:Number(
   document.getElementById("tempo").value
  ),

  signature:
   document.getElementById("signature").value,

  notes:JSON.parse(JSON.stringify(notes)),

  date:new Date().toLocaleDateString("da-DK")
 };

 songs.push(song);

 saveLibrary();
 renderLibrary();

 statusBox.textContent="Komposition gemt!";
}

/* STORAGE */

function saveLibrary(){

 try{

  localStorage.setItem(
   "goldenPianoLibrary",
   JSON.stringify(songs)
  );

 }catch(e){

  statusBox.textContent="Telefonens lager kunne ikke gemme";
 }
}

function loadLibrary(){

 try{

  songs=JSON.parse(
   localStorage.getItem("goldenPianoLibrary")||"[]"
  );

 }catch(e){
  songs=[];
 }

 renderLibrary();
}

/* LIBRARY */

function renderLibrary(){

 const box=document.getElementById("library");
 box.innerHTML="";

 songs.slice().reverse().forEach(s=>{

  const row=document.createElement("div");
  row.className="item";

  const label=document.createElement("span");
  label.textContent=s.title+" · "+s.date;

  const open=document.createElement("button");
  open.className="gold";
  open.textContent="ÅBN";
  open.onclick=()=>loadSong(s);

  const del=document.createElement("button");
  del.textContent="✕";
  del.onclick=()=>deleteSong(s.id);

  row.append(label,open,del);
  box.appendChild(row);
 });
}

function loadSong(s){

 stop();

 notes=JSON.parse(JSON.stringify(s.notes));

 document.getElementById("songTitle").value=s.title;
 document.getElementById("tempo").value=s.tempo;
 document.getElementById("signature").value=s.signature;

 draw();

 statusBox.textContent="Komposition åbnet: "+s.title;
}

function deleteSong(id){

 songs=songs.filter(s=>s.id!==id);

 saveLibrary();
 renderLibrary();
}

/* EXPORT */

function exportMusic(){

 const data={

  title:
   document.getElementById("songTitle").value||
   "Golden Piano",

  tempo:Number(
   document.getElementById("tempo").value
  ),

  signature:
   document.getElementById("signature").value,

  notes:notes
 };

 const blob=new Blob(
  [JSON.stringify(data,null,2)],
  {type:"application/json"}
 );

 const url=URL.createObjectURL(blob);

 const a=document.createElement("a");
 a.href=url;
 a.download="GoldenPiano.json";

 document.body.appendChild(a);
 a.click();
 a.remove();

 setTimeout(()=>URL.revokeObjectURL(url),1000);

 statusBox.textContent="Musikfil eksporteret";
}

/* IMPORT */

function importMusic(){
 document.getElementById("importFile").click();
}

document.getElementById("importFile").onchange=function(e){

 const f=e.target.files[0];
 if(!f)return;

 const r=new FileReader();

 r.onload=()=>{

  try{

   const d=JSON.parse(r.result);

   notes=d.notes||[];

   document.getElementById("songTitle").value=d.title||"";
   document.getElementById("tempo").value=d.tempo||100;
   document.getElementById("signature").value=d.signature||4;

   draw();

   statusBox.textContent="Musik importeret";

  }catch(err){

   statusBox.textContent="Kunne ikke læse musikfil";
  }
 };

 r.readAsText(f);
 e.target.value="";
};

/* DRAW SHEET */

function draw(){

 const rect=canvas.getBoundingClientRect();
 if(!rect.width)return;

 const dpr=window.devicePixelRatio||1;

 canvas.width=rect.width*dpr;
 canvas.height=rect.height*dpr;

 ctx.setTransform(dpr,0,0,dpr,0,0);

 const w=rect.width;
 const h=rect.height;

 ctx.fillStyle="#fffdf5";
 ctx.fillRect(0,0,w,h);

 const top=65;
 const gap=14;
 const x0=85;
 const noteSpacing=24;

 ctx.strokeStyle="#222";
 ctx.lineWidth=1;

 for(let i=0;i<5;i++){

  const y=top+i*gap;

  ctx.beginPath();
  ctx.moveTo(20,y);
  ctx.lineTo(w-15,y);
  ctx.stroke();
 }

 ctx.fillStyle="#222";
 ctx.font="58px serif";
 ctx.fillText("𝄞",22,top+50);

 ctx.font="16px Arial";

 ctx.fillText(
  document.getElementById("songTitle").value||
  "Golden Piano",
  95,
  28
 );

 notes.forEach((n,i)=>{

  const p=n.midi%12;
  const o=Math.floor(n.midi/12)-1;

  const di=[0,0,1,1,2,3,3,4,4,5,5,6][p];

  const step=(o-4)*7+di-2;

  const y=top+4*gap-step*(gap/2);
  const x=x0+i*noteSpacing;

  if(y>top+4*gap||y<top){

   ctx.beginPath();
   ctx.moveTo(x-10,y);
   ctx.lineTo(x+10,y);
   ctx.stroke();
  }

  ctx.fillStyle="#111";

  ctx.beginPath();
  ctx.ellipse(x,y,7,5,-.3,0,Math.PI*2);
  ctx.fill();

  ctx.beginPath();
  ctx.moveTo(x+6,y);
  ctx.lineTo(x+6,y-32);
  ctx.stroke();

  if(n.duration===0.5){

   ctx.beginPath();
   ctx.moveTo(x+6,y-32);
   ctx.quadraticCurveTo(x+20,y-25,x+12,y-16);
   ctx.stroke();
  }

  if([1,3,6,8,10].includes(p)){

   ctx.font="16px Arial";
   ctx.fillText("♯",x-17,y+5);
  }

  const beats=Number(
   document.getElementById("signature").value
  );

  let total=0;

  for(let j=0;j<=i;j++){
   total+=notes[j].duration;
  }

  if(total%beats===0&&i!==notes.length-1){

   ctx.beginPath();
   ctx.moveTo(x+15,top-5);
   ctx.lineTo(x+15,top+4*gap+5);
   ctx.stroke();
  }
 });

 ctx.fillStyle="#777";
 ctx.font="12px Arial";
 ctx.fillText(notes.length+" noder",w-80,h-12);
}

/* START */

window.addEventListener("resize",draw);
buildKeys();
loadLibrary();
draw();

</script>
</body>
</html>
