
<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Golden Piano</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>

<style>
*{box-sizing:border-box}
body{margin:0;background:#111;color:#eee;font-family:Arial}
header{text-align:center;padding:16px;color:#d6b35b}
header h1{margin:0;letter-spacing:4px;font-size:27px}
header p{color:#888;font-size:12px}
main{max-width:900px;margin:auto;padding:10px}
input,select{background:#202020;color:#eee;border:1px solid #555;border-radius:8px;padding:12px;font-size:15px}
#songTitle{width:100%;margin-bottom:10px}
.sheet{background:#fffdf5;border-radius:10px;overflow:hidden}
#staff{display:block;width:100%;height:330px}
.settings{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:10px 0}
.controls{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0}
button{padding:13px 5px;border-radius:8px;border:0;font-size:14px;font-weight:bold;background:#292929;color:white}
.gold{background:#c5a04b;color:#15120b}
.status{text-align:center;color:#d8b85f;min-height:24px;padding:5px}
.keyboardScroll{overflow-x:auto;padding:5px 0 12px}
.keyboard{display:flex;position:relative;height:205px;min-width:840px;touch-action:none}
.white{flex:1;background:linear-gradient(#fff,#e4e0d5);border:1px solid #777;border-radius:0 0 5px 5px;position:relative;color:#222;display:flex;justify-content:center;align-items:flex-end;padding-bottom:9px;z-index:1;touch-action:none}
.white.active{background:#d2ae5a}
.black{position:absolute;width:4.2%;height:125px;top:0;background:linear-gradient(#333,#080808);border:1px solid #000;border-radius:0 0 5px 5px;color:#fff;z-index:3;display:flex;align-items:flex-end;justify-content:center;padding-bottom:6px;touch-action:none}
.black.active{background:#bb953e}
.library{background:#1c1c1c;border:1px solid #333;border-radius:10px;padding:12px;margin-top:15px}
.library h3{color:#d6b35b;margin-top:0}
.item{border-bottom:1px solid #333;padding:10px 0;display:flex;align-items:center;gap:6px}
.item span{flex:1;overflow-wrap:anywhere}
.item button{padding:8px}
@media(max-width:500px){
#staff{height:290px}
.settings select{font-size:13px;padding:9px 4px}
}
</style>
</head>
<body>

<header>
<h1>GOLDEN PIANO</h1>
<p>YOUR PERSONAL MUSIC STUDIO</p>
</header>

<main>

<input id="songTitle" placeholder="Navn på musikstykke">

<div class="sheet">
<canvas id="staff"></canvas>
</div>

<div class="settings">
<select id="duration">
<option value="4">Helnode</option>
<option value="2">Halvnode</option>
<option value="1" selected>Fjerdedelsnode</option>
<option value="0.5">Ottendedelsnode</option>
<option value="0.25">Sekstendedelsnode</option>
</select>

<select id="tempo">
<option value="60">60 BPM</option>
<option value="70">70 BPM</option>
<option value="80">80 BPM</option>
<option value="90">90 BPM</option>
<option value="100" selected>100 BPM</option>
<option value="110">110 BPM</option>
<option value="120">120 BPM</option>
<option value="140">140 BPM</option>
<option value="160">160 BPM</option>
<option value="180">180 BPM</option>
</select>

<select id="signature">
<option value="4">4/4 takt</option>
<option value="3">3/4 takt</option>
<option value="2">2/4 takt</option>
<option value="6">6/8 takt</option>
</select>
</div>

<div class="controls">
<button class="gold" onclick="record()">● OPTAG</button>
<button class="gold" onclick="play()">▶ AFSPIL</button>
<button onclick="stop()">■ STOP</button>
</div>

<div class="controls">
<button onclick="undo()">↶ FORTRYD</button>
<button class="gold" onclick="save()">💾 GEM</button>
<button class="gold" onclick="newSong()">＋ NY SANG</button>
</div>

<div class="controls">
<button onclick="exportMusic()">📤 EKSPORT</button>
<button onclick="importMusic()">📥 IMPORT</button>
<button onclick="clearNotes()">🗑 SLET NODER</button>
</div>

<div class="status" id="status">Klar. Tryk på en tangent.</div>

<div class="keyboardScroll">
<div class="keyboard" id="keyboard"></div>
</div>

<div class="library">
<h3>🎼 Mine kompositioner</h3>
<div id="library"></div>
</div>

<input type="file" id="importFile" accept=".json" style="display:none">

</main>

<script>
"use strict";

/* =========================================
   ELEMENTS
========================================= */

const keyboard = document.getElementById("keyboard");
const canvas = document.getElementById("staff");
const ctx = canvas.getContext("2d");
const statusBox = document.getElementById("status");

let notes = [];
let recording = false;
let playing = false;
let timers = [];
let songs = [];

let piano = null;
let reverb = null;
let pianoReady = false;
let loadingPromise = null;

const activeKeys = new Map();

/* =========================================
   GRAND PIANO SAMPLE LOADING
========================================= */

async function loadPiano(){

  if(pianoReady) return true;
  if(loadingPromise) return loadingPromise;

  loadingPromise = (async()=>{

    try{

      statusBox.textContent = "Indlæser koncertflygel...";

      if(typeof Tone === "undefined"){
        throw new Error("Tone.js blev ikke indlæst");
      }

      await Tone.start();

      reverb = new Tone.Reverb({
        decay: 3,
        wet: 0.18
      });

      await reverb.ready;
      reverb.toDestination();

      piano = new Tone.Sampler({

        urls:{
          A0:"A0.mp3",
          C1:"C1.mp3",
          Ds1:"Ds1.mp3",
          Fs1:"Fs1.mp3",
          A1:"A1.mp3",

          C2:"C2.mp3",
          Ds2:"Ds2.mp3",
          Fs2:"Fs2.mp3",
          A2:"A2.mp3",

          C3:"C3.mp3",
          Ds3:"Ds3.mp3",
          Fs3:"Fs3.mp3",
          A3:"A3.mp3",

          C4:"C4.mp3",
          Ds4:"Ds4.mp3",
          Fs4:"Fs4.mp3",
          A4:"A4.mp3",

          C5:"C5.mp3",
          Ds5:"Ds5.mp3",
          Fs5:"Fs5.mp3",
          A5:"A5.mp3",

          C6:"C6.mp3",
          Ds6:"Ds6.mp3",
          Fs6:"Fs6.mp3",
          A6:"A6.mp3",

          C7:"C7.mp3",
          Ds7:"Ds7.mp3",
          Fs7:"Fs7.mp3",
          A7:"A7.mp3",

          C8:"C8.mp3"
        },

        baseUrl:"https://tonejs.github.io/audio/salamander/",

        release:1.5,

        onload:()=>{
          pianoReady=true;
          statusBox.textContent="Koncertflygel klar 🎹";
        }

      }).connect(reverb);

      /* Wait for all sampler files */
      await Tone.loaded();

      pianoReady=true;
      statusBox.textContent="Koncertflygel klar 🎹";

      return true;

    }catch(error){

      pianoReady=false;
      piano=null;
      loadingPromise=null;

      statusBox.textContent="Flygel kunne ikke indlæses. Tryk på en tangent for at prøve igen.";

      console.error("Grand Piano load error:",error);

      return false;
    }

  })();

  return loadingPromise;
}

/* =========================================
   MIDI NOTE NAME
========================================= */

function midiName(midi){
  return Tone.Frequency(midi,"midi").toNote();
}

/* =========================================
   BUILD KEYBOARD
========================================= */

function buildKeys(){

  keyboard.innerHTML="";

  const whites=[];

  for(let m=48;m<=83;m++){

    if(![1,3,6,8,10].includes(m%12)){

      const key=document.createElement("div");

      key.className="white";
      key.dataset.midi=m;

      if(m%12===0){
        key.textContent="C"+(Math.floor(m/12)-1);
      }

      key.onpointerdown=function(e){
        e.preventDefault();
        startKey(m,key);
      };

      keyboard.appendChild(key);
      whites.push(key);
    }
  }

  for(let m=49;m<=82;m++){

    if(![1,3,6,8,10].includes(m%12)) continue;

    const key=document.createElement("div");

    key.className="black";
    key.dataset.midi=m;

    const index=whites.findIndex(
      w=>Number(w.dataset.midi)===m-1
    );

    if(index<0) continue;

    key.style.left=((index+1)*100/whites.length)+"%";

    key.onpointerdown=function(e){
      e.preventDefault();
      startKey(m,key);
    };

    keyboard.appendChild(key);
  }
}

/* =========================================
   PRESS AND HOLD
========================================= */

async function startKey(midi,key){

  if(activeKeys.has(midi)) return;

  key.classList.add("active");
  activeKeys.set(midi,key);

  const loaded=await loadPiano();

  if(!loaded){
    return;
  }

  if(!activeKeys.has(midi)) return;

  try{

    piano.triggerAttack(midiName(midi));

  }catch(error){

    console.error("Note attack error:",error);
  }

  /* Add note to composition */
  const durationValue=Number(
    document.getElementById("duration").value
  );

  notes.push({
    midi:midi,
    duration:durationValue
  });

  draw();
}

/* =========================================
   RELEASE KEY
========================================= */

function releaseKey(midi){

  const key=activeKeys.get(midi);

  if(!key) return;

  activeKeys.delete(midi);
  key.classList.remove("active");

  if(piano && pianoReady){

    try{
      piano.triggerRelease(midiName(midi));
    }catch(error){
      console.error(error);
    }
  }
}

function releaseAllKeys(){

  const keys=Array.from(activeKeys.keys());

  keys.forEach(releaseKey);
}

window.addEventListener("pointerup",releaseAllKeys);
window.addEventListener("pointercancel",releaseAllKeys);
window.addEventListener("blur",releaseAllKeys);

/* =========================================
   RECORD
========================================= */

function record(){

  recording=!recording;

  if(recording){
    statusBox.textContent="● Optagelse aktiv";
  }else{
    statusBox.textContent="Optagelse stoppet";
  }
}

/* =========================================
   STOP
========================================= */

function stop(){

  recording=false;
  playing=false;

  timers.forEach(clearTimeout);
  timers=[];

  releaseAllKeys();

  if(piano && pianoReady){
    try{
      piano.releaseAll();
    }catch(e){}
  }

  statusBox.textContent="Stoppet";
}

/* =========================================
   PLAY COMPOSITION
========================================= */

async function play(){

  if(!notes.length){
    statusBox.textContent="Spil nogle toner først";
    return;
  }

  const loaded=await loadPiano();

  if(!loaded) return;

  stop();

  playing=true;
  statusBox.textContent="▶ Afspiller";

  const bpm=Number(document.getElementById("tempo").value);
  const beat=60000/bpm;

  let elapsed=0;

  notes.forEach(note=>{

    const startTime=elapsed;

    timers.push(setTimeout(()=>{

      if(!playing) return;

      const pitch=midiName(note.midi);

      try{
        piano.triggerAttack(pitch);
        flash(note.midi);
      }catch(e){
        console.error(e);
      }

      const noteMs=note.duration*beat;

      timers.push(setTimeout(()=>{

        if(playing){
          try{
            piano.triggerRelease(pitch);
          }catch(e){}
        }

      },noteMs));

    },startTime));

    elapsed+=note.duration*beat;
  });

  timers.push(setTimeout(()=>{

    playing=false;
    statusBox.textContent="Afspilning færdig";

  },elapsed+200));
}

/* =========================================
   KEY FLASH
========================================= */

function flash(midi){

  const key=keyboard.querySelector(
    '[data-midi="'+midi+'"]'
  );

  if(!key) return;

  key.classList.add("active");

  setTimeout(()=>{
    key.classList.remove("active");
  },180);
}

/* =========================================
   UNDO
========================================= */

function undo(){

  if(notes.length>0){
    notes.pop();
  }

  draw();
  statusBox.textContent="Sidste node fjernet";
}

/* =========================================
   NEW SONG
========================================= */

function newSong(){

  stop();

  notes=[];

  document.getElementById("songTitle").value="";

  draw();

  statusBox.textContent="Ny komposition";
}

/* =========================================
   CLEAR NOTES
========================================= */

function clearNotes(){

  if(confirm("Slet alle noder i dette musikstykke?")){

    notes=[];
    draw();

    statusBox.textContent="Noder slettet";
  }
}

/* =========================================
   SAVE
========================================= */

function save(){

  if(!notes.length){
    statusBox.textContent="Der er ingen noder at gemme";
    return;
  }

  const song={

    id:Date.now(),

    title:
      document.getElementById("songTitle").value ||
      "Min komposition",

    tempo:Number(document.getElementById("tempo").value),

    signature:document.getElementById("signature").value,

    notes:JSON.parse(JSON.stringify(notes)),

    date:new Date().toLocaleDateString("da-DK")
  };

  songs.push(song);

  saveLibrary();
  renderLibrary();

  statusBox.textContent="Komposition gemt!";
}

/* =========================================
   LOCAL STORAGE
========================================= */

function saveLibrary(){

  try{

    localStorage.setItem(
      "goldenPianoLibrary",
      JSON.stringify(songs)
    );

  }catch(error){

    statusBox.textContent="Telefonens lager kunne ikke gemme";
  }
}

function loadLibrary(){

  try{

    songs=JSON.parse(
      localStorage.getItem("goldenPianoLibrary") || "[]"
    );

  }catch(error){

    songs=[];
  }

  renderLibrary();
}

/* =========================================
   SONG LIBRARY
========================================= */

function renderLibrary(){

  const box=document.getElementById("library");

  box.innerHTML="";

  songs.slice().reverse().forEach(song=>{

    const row=document.createElement("div");
    row.className="item";

    const label=document.createElement("span");
    label.textContent=song.title+" · "+song.date;

    const loadButton=document.createElement("button");
    loadButton.className="gold";
    loadButton.textContent="ÅBN";
    loadButton.onclick=()=>loadSong(song);

    const deleteButton=document.createElement("button");
    deleteButton.textContent="✕";
    deleteButton.onclick=()=>deleteSong(song.id);

    row.append(label,loadButton,deleteButton);

    box.appendChild(row);
  });
}

function loadSong(song){

  stop();

  notes=JSON.parse(JSON.stringify(song.notes));

  document.getElementById("songTitle").value=song.title;
  document.getElementById("tempo").value=song.tempo;
  document.getElementById("signature").value=song.signature;

  draw();

  statusBox.textContent="Komposition åbnet: "+song.title;
}

function deleteSong(id){

  songs=songs.filter(song=>song.id!==id);

  saveLibrary();
  renderLibrary();
}

/* =========================================
   EXPORT
========================================= */

function exportMusic(){

  const data={

    title:
      document.getElementById("songTitle").value ||
      "Golden Piano",

    tempo:Number(document.getElementById("tempo").value),

    signature:document.getElementById("signature").value,

    notes:notes
  };

  const blob=new Blob(
    [JSON.stringify(data,null,2)],
    {type:"application/json"}
  );

  const url=URL.createObjectURL(blob);

  const link=document.createElement("a");
  link.href=url;
  link.download="GoldenPiano.json";

  document.body.appendChild(link);
  link.click();
  link.remove();

  setTimeout(()=>URL.revokeObjectURL(url),1000);

  statusBox.textContent="Musikfil eksporteret";
}

/* =========================================
   IMPORT
========================================= */

function importMusic(){
  document.getElementById("importFile").click();
}

document.getElementById("importFile").onchange=function(event){

  const file=event.target.files[0];

  if(!file) return;

  const reader=new FileReader();

  reader.onload=function(){

    try{

      const data=JSON.parse(reader.result);

      notes=data.notes || [];

      document.getElementById("songTitle").value=data.title || "";
      document.getElementById("tempo").value=data.tempo || 100;
      document.getElementById("signature").value=data.signature || 4;

      draw();

      statusBox.textContent="Musik importeret";

    }catch(error){

      statusBox.textContent="Kunne ikke læse musikfil";
    }
  };

  reader.readAsText(file);

  event.target.value="";
};

/* =========================================
   DRAW SHEET
========================================= */

function draw(){

  const rect=canvas.getBoundingClientRect();

  if(!rect.width) return;

  const dpr=window.devicePixelRatio || 1;

  canvas.width=rect.width*dpr;
  canvas.height=rect.height*dpr;

  ctx.setTransform(dpr,0,0,dpr,0,0);

  const w=rect.width;
  const h=rect.height;

  ctx.fillStyle="#fffdf5";
  ctx.fillRect(0,0,w,h);

  const top=65;
  const gap=14;
  const x0=85;
  const noteSpacing=24;

  /* Staff lines */
  ctx.strokeStyle="#222";
  ctx.lineWidth=1;

  for(let i=0;i<5;i++){

    const y=top+i*gap;

    ctx.beginPath();
    ctx.moveTo(20,y);
    ctx.lineTo(w-15,y);
    ctx.stroke();
  }

  /* Treble clef */
  ctx.fillStyle="#222";
  ctx.font="58px serif";
  ctx.fillText("𝄞",22,top+50);

  /* Song title */
  ctx.font="16px Arial";

  ctx.fillText(
    document.getElementById("songTitle").value || "Golden Piano",
    95,
    28
  );

  /* Notes */
  notes.forEach((note,index)=>{

    const midi=note.midi;
    const pitch=midi%12;
    const octave=Math.floor(midi/12)-1;

    const diatonic=[0,0,1,1,2,3,3,4,4,5,5,6][pitch];

    const step=(octave-4)*7+diatonic-2;

    const y=top+4*gap-step*(gap/2);
    const x=x0+index*noteSpacing;

    /* Ledger lines */
    if(y>top+4*gap || y<top){

      ctx.strokeStyle="#222";

      ctx.beginPath();
      ctx.moveTo(x-10,y);
      ctx.lineTo(x+10,y);
      ctx.stroke();
    }

    /* Note head */
    ctx.fillStyle="#111";

    ctx.beginPath();
    ctx.ellipse(x,y,7,5,-0.3,0,Math.PI*2);
    ctx.fill();

    /* Stem */
    ctx.beginPath();
    ctx.moveTo(x+6,y);
    ctx.lineTo(x+6,y-32);
    ctx.stroke();

    /* Eighth note flag */
    if(note.duration===0.5){

      ctx.beginPath();
      ctx.moveTo(x+6,y-32);
      ctx.quadraticCurveTo(x+20,y-25,x+12,y-16);
      ctx.stroke();
    }

    /* Sharp */
    if([1,3,6,8,10].includes(pitch)){

      ctx.font="16px Arial";
      ctx.fillText("♯",x-17,y+5);
    }

    /* Bar lines */
    const beatsPerBar=
      Number(document.getElementById("signature").value);

    let total=0;

    for(let j=0;j<=index;j++){
      total+=notes[j].duration;
    }

    if(total%beatsPerBar===0 && index!==notes.length-1){

      ctx.beginPath();
      ctx.moveTo(x+15,top-5);
      ctx.lineTo(x+15,top+4*gap+5);
      ctx.stroke();
    }
  });

  /* Note count */
  ctx.fillStyle="#777";
  ctx.font="12px Arial";
  ctx.fillText(notes.length+" noder",w-80,h-12);
}

/* =========================================
   START
========================================= */

window.onresize=draw;

buildKeys();
loadLibrary();
draw();

</script>
</body>
</html>
