<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Golden Piano</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#10131a;
  color:#f4f4f7;
  font-family:Arial,sans-serif;
  padding:14px
}

h1{
  text-align:center;
  margin:8px 0 14px;
  font-size:26px
}

.panel{
  background:#202633;
  border:1px solid #394252;
  border-radius:14px;
  padding:12px;
  margin-bottom:12px
}

#status{
  color:#b9c5d8;
  text-align:center;
  min-height:22px;
  font-size:14px;
  margin-bottom:10px
}

.keyboard-wrap{
  overflow-x:auto;
  padding:8px 0 12px;
  touch-action:pan-x
}

.keyboard{
  position:relative;
  display:flex;
  width:max-content;
  height:230px;
  user-select:none;
  touch-action:none
}

.white{
  position:relative;
  width:48px;
  height:230px;
  background:#fff;
  border:1px solid #222;
  border-radius:0 0 6px 6px;
  color:#111;
  display:flex;
  align-items:flex-end;
  justify-content:center;
  padding-bottom:8px;
  z-index:1
}

.black{
  position:absolute;
  width:30px;
  height:145px;
  background:#111;
  border:1px solid #555;
  border-radius:0 0 5px 5px;
  color:white;
  z-index:3;
  margin-left:-15px;
  top:0;
  box-shadow:0 3px 5px #0008
}

.key.active{
  background:#d9b45b!important;
  color:#111!important
}

.controls{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  justify-content:center
}

button{
  border:0;
  border-radius:10px;
  padding:11px 14px;
  background:#d7ae51;
  color:#111;
  font-weight:bold;
  font-size:15px
}

button.secondary{
  background:#394252;
  color:#fff
}

button:active{
  transform:scale(.98)
}

#notes{
  min-height:90px;
  white-space:pre-wrap;
  line-height:1.5;
  background:#141923;
  padding:10px;
  border-radius:8px;
  max-height:180px;
  overflow:auto
}

@media(max-width:420px){
  .white{width:43px}
  .keyboard{height:210px}
  .white{height:210px}
  .black{
    height:132px;
    width:27px;
    margin-left:-13.5px
  }
}
</style>
</head>

<body>

<h1>🎹 Golden Piano</h1>

<div class="panel">
  <div id="status">Loading piano sound…</div>
  <div class="keyboard-wrap">
    <div id="keyboard" class="keyboard"></div>
  </div>
</div>

<div class="panel">
  <div class="controls">
    <button id="sustain" class="secondary">Sustain: OFF</button>
    <button id="record">● Record</button>
    <button id="play">▶ Play</button>
    <button id="stop" class="secondary">■ Stop</button>
    <button id="save" class="secondary">Save</button>
    <button id="export" class="secondary">Export</button>
    <button id="import" class="secondary">Import</button>
    <input id="file" type="file" accept="application/json,.json" hidden>
  </div>
</div>

<div class="panel">
  <strong>Played notes</strong>
  <div id="notes">Your notes will appear here.</div>
</div>

<script>
(() => {

  const keyboard = document.getElementById('keyboard');
  const status = document.getElementById('status');
  const notesBox = document.getElementById('notes');
  const sustainBtn = document.getElementById('sustain');
  const fileInput = document.getElementById('file');

  const whiteNotes = ['C','D','E','F','G','A','B'];
  const blackAfter = new Set(['C','D','F','G','A']);

  const active = new Map();
  const held = new Set();

  let soundfont = null;
  let audioCtx = null;
  let sustain = false;
  let recording = false;
  let recordStart = 0;
  let recorded = [];
  let playbackTimers = [];

  const notesText = [];

  const midiName = (m) => {
    const names = [
      'C','C#','D','D#','E','F',
      'F#','G','G#','A','A#','B'
    ];
    return names[m % 12] + (Math.floor(m / 12) - 1);
  };

  function buildKeyboard(){

    let whiteIndex = 0;

    for(let octave = 3; octave <= 4; octave++){

      for(const n of whiteNotes){

        const midiNote =
          (octave + 1) * 12 +
          ['C','D','E','F','G','A','B'].indexOf(n);

        const key = document.createElement('div');

        key.className = 'key white';
        key.dataset.midi = midiNote;
        key.textContent = n + (octave === 4 ? '4' : '');

        key.addEventListener('pointerdown', e => {
          e.preventDefault();
          key.setPointerCapture(e.pointerId);
          noteOn(midiNote,key);
        });

        key.addEventListener('pointerup', e => {
          e.preventDefault();
          noteOff(midiNote,key);
        });

        key.addEventListener('pointercancel', () => {
          noteOff(midiNote,key);
        });

        key.addEventListener('lostpointercapture', () => {
          noteOff(midiNote,key);
        });

        keyboard.appendChild(key);
        whiteIndex++;

        if(blackAfter.has(n)){

          const blackMidi = midiNote + 1;
          const black = document.createElement('div');

          black.className = 'key black';
          black.dataset.midi = blackMidi;
          black.textContent = '';

          black.style.left = (whiteIndex * 48 - 15) + 'px';

          black.addEventListener('pointerdown', e => {
            e.preventDefault();
            e.stopPropagation();
            black.setPointerCapture(e.pointerId);
            noteOn(blackMidi,black);
          });

          black.addEventListener('pointerup', e => {
            e.preventDefault();
            noteOff(blackMidi,black);
          });

          black.addEventListener('pointercancel', () => {
            noteOff(blackMidi,black);
          });

          black.addEventListener('lostpointercapture', () => {
            noteOff(blackMidi,black);
          });

          keyboard.appendChild(black);
        }
      }
    }
  }

  function loadSound(){

    if(!window.Soundfont){

      status.textContent = 'Loading piano library…';

      const s = document.createElement('script');

      s.src =
        'https://cdn.jsdelivr.net/npm/soundfont-player@0.12.0/dist/soundfont-player.min.js';

      s.onload = loadSound;

      s.onerror = () => {
        status.textContent = 'Could not load sound library. Check internet connection.';
      };

      document.head.appendChild(s);
      return;
    }

    audioCtx = audioCtx ||
      new (window.AudioContext || window.webkitAudioContext)();

    window.Soundfont.instrument(
      audioCtx,
      'acoustic_grand_piano',
      {soundfont:'MusyngKite'}
    )
    .then(inst => {
      soundfont = inst;
      status.textContent = 'Grand Piano ready. Touch and hold keys to play.';
    })
    .catch(() => {
      status.textContent = 'Piano sound failed to load. Please refresh with internet.';
    });
  }

  function noteOn(m,key){

    if(active.has(m)) return;

    if(audioCtx && audioCtx.state === 'suspended'){
      audioCtx.resume();
    }

    if(!soundfont) return;

    const node = soundfont.play(
      m,
      audioCtx.currentTime,
      {gain:0.9}
    );

    active.set(m,{node,key});
    held.add(m);

    key.classList.add('active');

    if(recording){
      recorded.push({
        type:'on',
        note:m,
        time:Date.now()-recordStart
      });
    }

    notesText.push(midiName(m));

    notesBox.textContent =
      notesText.slice(-70).join('  ');

    notesBox.scrollTop = notesBox.scrollHeight;
  }

  function noteOff(m,key){

    held.delete(m);

    if(!active.has(m)) return;

    const item = active.get(m);

    if(!sustain){

      try{
        item.node.stop();
      }catch(e){}

      active.delete(m);
      item.key.classList.remove('active');
    }

    if(recording){
      recorded.push({
        type:'off',
        note:m,
        time:Date.now()-recordStart
      });
    }
  }

  function releaseAll(){

    for(const [m,item] of active){

      try{
        item.node.stop();
      }catch(e){}

      item.key.classList.remove('active');
    }

    active.clear();
    held.clear();
  }

  function stopPlayback(){

    playbackTimers.forEach(clearTimeout);
    playbackTimers = [];

    releaseAll();
  }

  sustainBtn.onclick = () => {

    sustain = !sustain;

    sustainBtn.textContent =
      'Sustain: ' + (sustain ? 'ON' : 'OFF');

    sustainBtn.classList.toggle('secondary',!sustain);

    if(!sustain){

      for(const [m,item] of active){

        if(!held.has(m)){

          try{
            item.node.stop();
          }catch(e){}

          item.key.classList.remove('active');
          active.delete(m);
        }
      }
    }
  };

  document.getElementById('record').onclick = () => {

    recording = !recording;

    if(recording){

      recorded = [];
      recordStart = Date.now();

      document.getElementById('record').textContent = '■ Finish';
      status.textContent = 'Recording…';

    }else{

      document.getElementById('record').textContent = '● Record';
      status.textContent = 'Recording saved in memory.';
    }
  };

  document.getElementById('play').onclick = () => {

    if(!recorded.length){
      status.textContent = 'Record some notes first.';
      return;
    }

    stopPlayback();

    status.textContent = 'Playing recording…';

    recorded.forEach(ev => {

      const timer = setTimeout(() => {

        const key = document.querySelector(
          '.key[data-midi="' + ev.note + '"]'
        );

        if(ev.type === 'on' && key){
          noteOn(ev.note,key);
        }else if(ev.type === 'off' && key){
          noteOff(ev.note,key);
        }

      },ev.time);

      playbackTimers.push(timer);
    });

    playbackTimers.push(
      setTimeout(
        () => status.textContent = 'Playback finished.',
        Math.max(...recorded.map(x => x.time)) + 100
      )
    );
  };

  document.getElementById('stop').onclick = () => {

    stopPlayback();
    recording = false;

    document.getElementById('record').textContent = '● Record';
    status.textContent = 'Stopped.';
  };

  document.getElementById('save').onclick = () => {

    localStorage.setItem(
      'goldenPianoRecording',
      JSON.stringify(recorded)
    );

    status.textContent = 'Recording saved on this device.';
  };

  document.getElementById('export').onclick = () => {

    const blob = new Blob(
      [JSON.stringify(recorded,null,2)],
      {type:'application/json'}
    );

    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');

    a.href = url;
    a.download = 'golden-piano-recording.json';
    a.click();

    URL.revokeObjectURL(url);
  };

  document.getElementById('import').onclick = () => {
    fileInput.click();
  };

  fileInput.onchange = () => {

    const file = fileInput.files[0];

    if(!file) return;

    const reader = new FileReader();

    reader.onload = () => {

      try{

        const data = JSON.parse(reader.result);

        if(Array.isArray(data)){
          recorded = data;
          status.textContent = 'Recording imported.';
        }else{
          status.textContent = 'Invalid recording file.';
        }

      }catch(e){
        status.textContent = 'Could not read file.';
      }
    };

    reader.readAsText(file);
  };

  buildKeyboard();

  const saved = localStorage.getItem('goldenPianoRecording');

  if(saved){
    try{
      recorded = JSON.parse(saved);
    }catch(e){}
  }

  loadSound();

})();
</script>
</body>
</html>
